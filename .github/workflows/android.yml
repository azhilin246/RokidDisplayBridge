name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify, lint, and assemble
        run: |
          chmod +x gradlew
          ./gradlew \
            :protocol:kotlin:testDebugUnitTest \
            :apps:android-companion:testDebugUnitTest \
            :apps:glasses:testDebugUnitTest \
            :apps:android-companion:lintDebug \
            :apps:glasses:lintDebug \
            :apps:android-companion:assembleDebug \
            :apps:glasses:assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: display-bridge-debug-apks
          if-no-files-found: error
          path: |
            apps/android-companion/build/outputs/apk/debug/android-companion-debug.apk
            apps/glasses/build/outputs/apk/debug/glasses-debug.apk
